
services:
  web:
    build: .
    container_name: gyansetu_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # - db
      # - redis
    volumes:
      - .:/app
      # - ./uploaded_files:/app/uploaded_files

  celery_worker:
    build: .
    container_name: gyansetu_celery
    command: celery -A api.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    # depends_on:
      # - redis
      # - db
    volumes:
      - .:/app
      # - ./uploaded_files:/app/uploaded_files

